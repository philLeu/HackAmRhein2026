[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treatment-material-flow-planner"
version = "0.1.0"
description = "Synthetic treatment logistics walking skeleton"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit>=1.65,<2", "altair>=6.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "setuptools>=75", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
