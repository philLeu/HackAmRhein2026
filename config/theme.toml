# Control-room demo theme; all visual values live here.
[branding]
width = 250
background = "#F5EFFA"
padding = "0.5rem 4vw"
gap = "0.9rem"
mobile_width = 155
mobile_gap = "0.65rem"
mobile_breakpoint = 480
max_width_vw = 52
margin_bottom = "1.25rem"
motto = "Smart routes. Vital timing."
motto_color = "#321746"
motto_size = "1.5rem"
motto_mobile_size = "1.05rem"
motto_weight = 700
motto_tracking = "0.01em"
motto_line_height = 1.25
logo_relief = "0 4px 2px #32174666"
logo_relief_clip = "inset(0 0 26% 0)"
inner_max_width = "1600px"

[route]
card_width = 360
label_font_size = 18

[theme]
base = "dark"
backgroundColor = "#0E1726"
secondaryBackgroundColor = "#18263B"
textColor = "#EDF3FA"
primaryColor = "#56D6C4"
font = "sans-serif"

[surface]
muted = "#B4C5D9"
border = "#34465E"
radius = "12px"
padding = "1.25rem"

[timeline]
event_color = "#56D6C4"
deadline_color = "#FF8791"
height_per_lane = 52
axis_tick_count = 3
axis_label_angle = -20
event_radius = 4
deadline_dash = [5, 4]

[rhine]
normal = "#0ca30c"
watch = "#0ca30c"
warning = "#fab219"
critical = "#d03b3b"
unknown = "#B4C5D9"
series = "#66AAFF"
ink = "#EDF3FA"
grid = "#34465E"
zone_opacity = 0.16
outer_opacity = 0.12
inner_opacity = 0.22
forecast_dash = [6, 4]
height = 380
